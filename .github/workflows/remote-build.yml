# Fork: builds "Handy Remote" for Apple Silicon and attaches the dmg to a prerelease.
# Mirrors the macOS steps of upstream's build.yml, without its signing environment: build.yml passes
# APPLE_CERTIFICATE="" when signing is off, and tauri-bundler then tries (and fails) to import an empty
# certificate. Here no APPLE_* variable is set, so the bundler uses tauri.conf.json's ad-hoc identity ("-").
# No Apple Developer ID: first launch needs System Settings → Privacy & Security → Open Anyway
# (or `xattr -dr com.apple.quarantine "/Applications/Handy Remote.app"`).
name: Remote build

on:
  workflow_dispatch:
  push:
    branches: [remote-v0.9.8]

permissions:
  contents: write

concurrency:
  group: remote-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-26-aarch64-apple-darwin-remote-v1
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      - name: Build (ad-hoc signed)
        run: bun run tauri build --target aarch64-apple-darwin

      - name: Verify and package
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP="$BUNDLE/macos/Handy Remote.app"
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          DMG=$(find "$BUNDLE/dmg" -name '*.dmg' | head -1)
          test -n "$DMG"
          cp "$DMG" Handy-Remote-aarch64.dmg
          shasum -a 256 Handy-Remote-aarch64.dmg | tee Handy-Remote-aarch64.dmg.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="remote-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Handy-Remote-aarch64.dmg Handy-Remote-aarch64.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Handy Remote build ${GITHUB_RUN_NUMBER}" \
            --notes "Handy v0.9.8 with a remote transcription engine (fork). Built from ${GITHUB_SHA}. Ad-hoc signed."
