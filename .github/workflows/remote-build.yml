# Fork: builds "Handy Remote" (branch `remote`) for Apple Silicon with upstream's reusable build workflow, unsigned
# (ad-hoc), then attaches the dmg to a prerelease. No Apple Developer ID: first launch needs System Settings →
# Privacy & Security → Open Anyway (or `xattr -dr com.apple.quarantine "/Applications/Handy Remote.app"`).
name: Remote build

on:
  workflow_dispatch:
  push:
    branches: [remote]

permissions:
  contents: write

concurrency:
  group: remote-build
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      platform: macos-26
      target: aarch64-apple-darwin
      build-args: --target aarch64-apple-darwin
      sign-binaries: false
      upload-artifacts: true
      asset-prefix: handy-remote

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handy-remote-aarch64-apple-darwin
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG=$(find dist -name '*.dmg' | head -1)
          test -n "$DMG"
          cp "$DMG" Handy-Remote-aarch64.dmg
          sha256sum Handy-Remote-aarch64.dmg | tee Handy-Remote-aarch64.dmg.sha256
          TAG="remote-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Handy-Remote-aarch64.dmg Handy-Remote-aarch64.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Handy Remote build ${GITHUB_RUN_NUMBER}" \
            --notes "Handy with a remote transcription engine (fork). Built from ${GITHUB_SHA}. Ad-hoc signed."
