# Fork: builds "Handy Remote" for Apple Silicon.
# Mirrors the macOS (aarch64-apple-darwin) steps of upstream's build.yml at v0.10.1, without its
# signing environment: build.yml passes APPLE_CERTIFICATE="" when signing is off, and
# tauri-bundler then tries (and fails) to import an empty certificate. Here no APPLE_* variable is
# set, so the bundler uses tauri.conf.json's ad-hoc identity ("-").
# A push uploads the dmg as a workflow artifact only. A GitHub prerelease is made only by a manual
# run with `release` ticked.
# No Apple Developer ID: first launch needs System Settings → Privacy & Security → Open Anyway
# (or `xattr -dr com.apple.quarantine "/Applications/Handy Remote.app"`).
name: Remote build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the dmg as a GitHub prerelease"
        type: boolean
        default: false
  push:
    branches: [remote-v0.10.1]

concurrency:
  group: remote-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      # Only the release step writes (creates the prerelease).
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # As upstream: a release build skips the cache, so it is compiled clean and no stale cached
      # native library can be linked into it.
      - name: Rust cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release) }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-26-aarch64-apple-darwin-remote-v2
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      # The lib tests, including the golden test of the owner's v0.9.8 settings store
      # (settings/remote_store_golden.rs). A failure stops the build: no dmg that could change
      # stored settings.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # PLACEHOLDER, disabled: a fixed signing identity. Ad-hoc signing gives every build a new
      # designated requirement (its cdhash, printed below), so macOS asks again for Accessibility
      # and Microphone after each update. To keep those grants across updates, import one stable
      # certificate here (self-signed or Developer ID, from repository secrets) and pass its name
      # to the build step as APPLE_SIGNING_IDENTITY. No secret is referenced until then.
      - name: Import fixed signing certificate (placeholder)
        if: ${{ false }}
        run: echo "Not set up yet; see the comment above this step."

      - name: Build (ad-hoc signed)
        run: bun run tauri build --target aarch64-apple-darwin

      - name: Verify and package
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP="$BUNDLE/macos/Handy Remote.app"
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          DMG=$(find "$BUNDLE/dmg" -name '*.dmg' | head -1)
          test -n "$DMG"
          cp "$DMG" Handy-Remote-aarch64.dmg
          shasum -a 256 Handy-Remote-aarch64.dmg | tee Handy-Remote-aarch64.dmg.sha256

      # The requirement macOS checks permission grants against. With ad-hoc signing it is the
      # cdhash, so it changes with every build.
      - name: Show designated requirement
        run: codesign -d -r- "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Handy Remote.app"

      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: Handy-Remote-${{ steps.get-version.outputs.version }}-aarch64-${{ github.run_number }}
          path: |
            Handy-Remote-aarch64.dmg
            Handy-Remote-aarch64.dmg.sha256
          retention-days: 30

      - name: Publish prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          TAG="remote-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Handy-Remote-aarch64.dmg Handy-Remote-aarch64.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Handy Remote build ${GITHUB_RUN_NUMBER}" \
            --notes "Handy v${VERSION} with a remote transcription engine (fork): one-shot upload or live dictation to a self-hosted server, Remote settings page, tray toggle, opt-in speculative cleanup. Built from ${GITHUB_SHA}. Ad-hoc signed."
