# Fork: builds "Handy Remote" for Apple Silicon (aarch64) and Intel (x86_64) Macs.
# Mirrors the macOS steps of upstream's build.yml/release.yml at v0.10.1 (Intel is cross-compiled
# on an Apple Silicon runner, as upstream does), without its signing environment: build.yml passes
# APPLE_CERTIFICATE="" when signing is off, and tauri-bundler then tries (and fails) to import an
# empty certificate. Here no APPLE_CERTIFICATE is set; the fixed certificate is imported by hand.
# A push uploads each dmg as a workflow artifact only. A GitHub prerelease (both dmgs) is made only
# by a manual run with `release` ticked.
# No Apple Developer ID: first launch needs System Settings → Privacy & Security → Open Anyway
# (or `xattr -dr com.apple.quarantine "/Applications/Handy Remote.app"`).
name: Remote build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish both dmgs as one GitHub prerelease"
        type: boolean
        default: false
  push:
    branches: [remote-v0.10.1]

concurrency:
  group: remote-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26 # Apple Silicon (M1 and above)
            target: aarch64-apple-darwin
            arch: aarch64
            lipo: arm64
          - runner: macos-latest # Intel Macs, cross-compiled as upstream does
            target: x86_64-apple-darwin
            arch: x86_64
            lipo: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # As upstream: a release build skips the cache, so it is compiled clean and no stale cached
      # native library can be linked into it.
      - name: Rust cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release) }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.runner }}-${{ matrix.target }}-remote-v2
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      # The lib tests, including the golden test of the owner's v0.9.8 settings store
      # (settings/remote_store_golden.rs). A failure stops the build: no dmg that could change
      # stored settings. Both runners are Apple Silicon hosts, so the tests run once.
      - name: Rust tests
        if: matrix.arch == 'aarch64'
        working-directory: src-tauri
        run: cargo test --lib

      # A fixed signing identity (self-signed, from repository secrets). Ad-hoc signing gives every
      # build a new designated requirement (its cdhash), so macOS forgets the Accessibility,
      # Microphone and Automation grants after each update; one stable certificate keeps them.
      # Without the secrets (e.g. a fork of this fork) the build stays ad-hoc signed.
      - name: Import fixed signing certificate
        id: sign
        env:
          P12_B64: ${{ secrets.HANDY_SIGN_P12_B64 }}
          P12_PASSWORD: ${{ secrets.HANDY_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_B64}" ]; then echo "No signing secrets: ad-hoc build"; exit 0; fi
          KC="$RUNNER_TEMP/handy-sign.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Self-signed: trust it for code signing on this runner only.
          security find-certificate -c "Handy Remote Self-Signed" -p "$KC" > "$RUNNER_TEMP/sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem" \
            || echo "::warning::could not mark the certificate trusted; signing may still work"
          security find-identity -p codesigning "$KC"
          # The SHA-1 of the certificate names the identity exactly (no name lookup ambiguity).
          HASH=$(openssl x509 -in "$RUNNER_TEMP/sign.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          echo "APPLE_SIGNING_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run tauri build --target ${{ matrix.target }}

      # Also proves the architecture: an Intel Mac cannot open an arm64-only app.
      - name: Verify and package
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          LIPO: ${{ matrix.lipo }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/$TARGET/release/bundle"
          APP="$BUNDLE/macos/Handy Remote.app"
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          ARCHS=$(lipo -archs "$EXE")
          echo "binary architectures: $ARCHS"
          if [ "$ARCHS" != "$LIPO" ]; then echo "::error::expected $LIPO, got $ARCHS"; exit 1; fi
          DMG=$(find "$BUNDLE/dmg" -name '*.dmg' | head -1)
          test -n "$DMG"
          cp "$DMG" "Handy-Remote-$ARCH.dmg"
          shasum -a 256 "Handy-Remote-$ARCH.dmg" | tee "Handy-Remote-$ARCH.dmg.sha256"

      # The requirement macOS checks permission grants against. Signed with the fixed certificate it
      # must name the certificate (stable across builds), never a cdhash (new every build).
      - name: Check designated requirement
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/$TARGET/release/bundle/macos/Handy Remote.app"
          codesign -d -r- "$APP" 2>&1 | tee "$RUNNER_TEMP/dr.txt"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            if grep -q 'certificate' "$RUNNER_TEMP/dr.txt" && ! grep -q 'cdhash' "$RUNNER_TEMP/dr.txt"; then
              echo "designated requirement is tied to the fixed certificate"
            else
              echo "::error::designated requirement is not tied to the fixed certificate"; exit 1
            fi
          fi

      - name: Remove signing keychain
        if: always() && steps.sign.outputs.keychain != ''
        run: security delete-keychain "${{ steps.sign.outputs.keychain }}" || true

      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: Handy-Remote-${{ steps.get-version.outputs.version }}-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            Handy-Remote-${{ matrix.arch }}.dmg
            Handy-Remote-${{ matrix.arch }}.dmg.sha256
          retention-days: 30

  # One prerelease holding both dmgs, only when both built.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Download dmgs
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          ls -l dist
          TAG="remote-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/Handy-Remote-aarch64.dmg dist/Handy-Remote-aarch64.dmg.sha256 \
            dist/Handy-Remote-x86_64.dmg dist/Handy-Remote-x86_64.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Handy Remote build ${GITHUB_RUN_NUMBER}" \
            --notes "Handy v${VERSION} with a remote transcription engine (fork): one-shot upload or live dictation to a self-hosted server, Remote settings page, tray toggle, opt-in speculative cleanup. Handy-Remote-aarch64.dmg = Apple Silicon (M1 and later); Handy-Remote-x86_64.dmg = Intel Macs. Built from ${GITHUB_SHA}. Signed with the fork's fixed self-signed certificate."
